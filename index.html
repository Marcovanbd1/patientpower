<style>
  :root{
    --ink:#10161d;
    --ink-2:#1a222b;
    --ink-3:#232d38;
    --stone:#d9d2c2;
    --paper:#ece6d9;
    --paper-dim:#a9b3bc;
    --signal:#d6402c;
    --slate:#7f97a3;
    --line:rgba(236,230,217,0.14);
    --serif:'Fraunces', serif;
    --sans:'IBM Plex Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
    --measure:38rem;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:var(--stone); text-decoration-color:var(--signal); text-underline-offset:3px; }
  a:hover{ color:var(--paper); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--signal); outline-offset:3px; }

  .masthead{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:1rem;
    padding:1rem 1.5rem;
    background:rgba(16,22,29,0.88);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:0.85rem;
    letter-spacing:0.07em;
    text-transform:uppercase;
  }
  .masthead__onair{ display:flex; align-items:center; gap:0.5rem; color:var(--stone); }
  .tally{
    width:9px; height:9px; border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 0 0 rgba(214,64,44,0.6);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(214,64,44,0.5); }
    70%{ box-shadow:0 0 0 7px rgba(214,64,44,0); }
    100%{ box-shadow:0 0 0 0 rgba(214,64,44,0); }
  }
  .masthead__name{
    display:none;
    color:var(--stone);
    font-size:1.15rem;
    font-weight:500;
    letter-spacing:0.04em;
  }
  .masthead__right{ display:flex; align-items:center; gap:1.1rem; color:var(--paper-dim); }
  @media (min-width:640px){ .masthead__name{ display:inline; } }

  main{ max-width:52rem; margin:0 auto; padding:0 1.5rem; }

  .rundown__item{
    padding:4.5rem 0;
    border-bottom:1px solid var(--line);
    opacity:0; transform:translateY(14px);
    transition:opacity 0.7s ease, transform 0.7s ease;
  }
  .rundown__item.is-visible{ opacity:1; transform:translateY(0); }
  .rundown__item:last-of-type{ border-bottom:none; }

  .rundown__meta{
    display:flex; flex-wrap:wrap; gap:0.9rem; align-items:baseline;
    font-family:var(--mono);
    font-size:0.72rem;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:1.1rem;
  }
  .rundown__badge{ padding:0.15rem 0.5rem; border:1px solid currentColor; border-radius:2px; }
  .rundown__badge--live{ color:var(--signal); }

  .rundown__title{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(1.7rem, 1.2rem + 2vw, 2.6rem);
    line-height:1.15;
    margin:0 0 1.4rem 0;
    max-width:22ch;
  }
  .rundown__body{ max-width:var(--measure); color:var(--paper); }
  .rundown__body p{ margin:0 0 1.1rem 0; }
  .rundown__body p:last-child{ margin-bottom:0; }
  .rundown__list{ margin:0; padding:0; list-style:none; max-width:var(--measure); }
  .rundown__list li{ position:relative; padding-left:1.3rem; margin-bottom:0.9rem; }
  .rundown__list li::before{ content:"·"; position:absolute; left:0.25rem; top:0; color:var(--signal); font-weight:600; }
  .rundown__list strong{ color:var(--stone); font-weight:600; }

  /* Lens demo, item 01 */
  .lens-demo{ padding-top:3.5rem; }
  .lens-demo__sentence{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.3rem, 1.05rem + 1.3vw, 1.8rem);
    color:var(--paper);
    max-width:28ch;
    margin:0 0 2rem 0;
    line-height:1.4;
  }
  .lens-demo__button{
    font-family:var(--mono);
    font-size:0.85rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--signal);
    background:transparent;
    border:1px solid var(--signal);
    padding:0.75rem 1.4rem;
    cursor:pointer;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .lens-demo__button:hover{ background:var(--signal); color:var(--ink); }
  .lens-demo__voices{
    margin-top:2.5rem;
    padding-top:2rem;
    border-top:1px solid var(--line);
    display:grid;
    gap:1.6rem;
  }
  .lens-demo__voices[hidden]{ display:none; }
  .lens-demo__voice{ opacity:0; transform:translateY(8px); animation:voiceIn 0.6s ease forwards; }
  .lens-demo__voice:nth-child(1){ animation-delay:0.05s; }
  .lens-demo__voice:nth-child(2){ animation-delay:0.25s; }
  .lens-demo__voice:nth-child(3){ animation-delay:0.45s; }
  .lens-demo__voice:nth-child(4){ animation-delay:0.65s; }
  @keyframes voiceIn{ to{ opacity:1; transform:translateY(0); } }
  .lens-demo__role{
    display:block;
    font-family:var(--mono);
    font-size:0.72rem;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--signal);
    margin-bottom:0.4rem;
  }
  .lens-demo__voice p{ margin:0; max-width:var(--measure); color:var(--paper); }
  .lens-demo__scope{
    margin-top:2.2rem;
    padding-top:1.6rem;
    border-top:1px solid var(--line);
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(1.4rem, 1.1rem + 1.2vw, 1.9rem);
    color:var(--stone);
    opacity:0; transform:translateY(8px);
    animation:voiceIn 0.7s ease forwards;
    animation-delay:0.9s;
  }
  .lens-demo__scope[hidden]{ display:none; }

  .screen-wall{ display:grid; grid-template-columns:repeat(8,1fr); gap:4px; max-width:15rem; margin:1.6rem 0 0.6rem 0; }
  .screen-wall span{ display:block; aspect-ratio:4/3; background:var(--ink-3); border:1px solid var(--line); }
  .screen-wall span.is-live{ background:var(--signal); border-color:var(--signal); }
  .screen-wall__caption{ font-family:var(--mono); font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--paper-dim); margin-bottom:1.6rem; }

  /* Aside, Mark's own note */
  .rundown__item.aside{ border-left:2px solid var(--line); padding-left:1.5rem; }
  .rundown__item.aside .rundown__title{ font-size:clamp(1.3rem, 1.1rem + 1vw, 1.8rem); color:var(--stone); }
  .rundown__item.aside .rundown__body{ color:var(--paper-dim); font-size:0.95rem; }
  .rundown__item.aside .rundown__body em{ color:var(--paper-dim); font-style:italic; }
  .aside__photo{
    width:8.5rem; aspect-ratio:3/4;
    border:1px solid var(--line);
    overflow:hidden;
    margin:0 0 1.6rem 0;
    position:relative;
  }
  .aside__photo img{ width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1) contrast(1.08) brightness(0.92); }
  .aside__photo::after{ content:""; position:absolute; inset:0; background:var(--slate); mix-blend-mode:color; opacity:0.55; }

  footer{
    max-width:52rem; margin:0 auto; padding:3rem 1.5rem 5rem;
    font-family:var(--mono); font-size:0.72rem; letter-spacing:0.05em;
    color:var(--paper-dim);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:1rem;
  }
  footer a{ color:var(--paper-dim); }
  footer a:hover{ color:var(--stone); }

  .contact__email{ font-family:var(--serif); font-size:clamp(1.4rem, 1.1rem + 1.4vw, 1.9rem); display:inline-block; margin-bottom:0.6rem; }

  .rundown__body .signature{
    margin-top:1.8rem;
    font-family:var(--serif);
    font-style:italic;
    font-size:0.95rem;
    color:var(--paper-dim);
  }

  .colour-bars{
    width:100%;
    height:28px;
    margin-top:2rem;
    background:linear-gradient(to right,
      #ffffff 0%, #ffffff 14.28%,
      #ffff00 14.28%, #ffff00 28.56%,
      #00ffff 28.56%, #00ffff 42.84%,
      #00ff00 42.84%, #00ff00 57.12%,
      #ff00ff 57.12%, #ff00ff 71.4%,
      #ff0000 71.4%, #ff0000 85.68%,
      #0000ff 85.68%, #0000ff 100%
    );
  }
  .colour-bars__caption{
    margin:0;
    padding:0.9rem 1.5rem 0;
    text-align:center;
    font-family:var(--mono);
    font-size:0.68rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--paper-dim);
  }
  .colour-bars__caption--top{
    padding:0.7rem 1.5rem;
    background:var(--ink);
    border-bottom:1px solid var(--line);
    font-size:0.6rem;
    letter-spacing:0.14em;
    color:var(--slate);
  }
</style>
</head>

function renderMeta(item, type){
  const badgeClass = type === "LIVE" ? "rundown__badge rundown__badge--live" : "rundown__badge";
  return `<div class="rundown__meta"><span>ITEM ${item}</span><span class="${badgeClass}">${type}</span></div>`;
}

function renderScreenWall(caption){
  const total = 24, liveIndex = 14;
  let cells = "";
  for(let i=0;i<total;i++){ cells += `<span class="${i===liveIndex ? "is-live" : ""}"></span>`; }
  return `<div class="screen-wall" role="img" aria-label="A grid of screens, one highlighted as the live feed">${cells}</div><div class="screen-wall__caption">${caption}</div>`;
}

function renderBodyBlock(section){
  let html = "";
  if(section.intro) html += `<p>${section.intro}</p>`;
  if(section.paragraphs) html += section.paragraphs.map(p=>`<p>${p}</p>`).join("");
  if(section.visual === "screenwall") html += renderScreenWall(section.visualCaption);
  if(section.paragraphsAfter) html += section.paragraphsAfter.map(p=>`<p>${p}</p>`).join("");
  if(section.list) html += `<ul class="rundown__list">${section.list.map(l=>`<li>${l}</li>`).join("")}</ul>`;
  if(section.outro) html += `<p>${section.outro}</p>`;
  return html;
}

function buildLensDemo(d){
  const meta = renderMeta(d.item, d.type);
  const voicesHtml = d.voices.map(v=>`<div class="lens-demo__voice"><span class="lens-demo__role">${v.role}</span><p>${v.text}</p></div>`).join("");
  return `
  <section class="rundown__item lens-demo" id="item-${d.item}">
    ${meta}
    <p class="lens-demo__sentence">&ldquo;${d.sentence}&rdquo;</p>
    <button class="lens-demo__button" id="lensButton" aria-expanded="false">${d.buttonLabel}</button>
    <div class="lens-demo__voices" id="lensVoices" hidden>${voicesHtml}</div>
    <p class="lens-demo__scope" id="lensScope" hidden>${d.scope}</p>
  </section>`;
}

function buildSection(s){
  const meta = renderMeta(s.item, s.type);
  const classes = "rundown__item" + (s.aside ? " aside" : "");
  const photoHtml = s.photo ? `<div class="aside__photo"><img src="${s.photo.src}" alt="${s.photo.alt}"></div>` : "";
  return `
  <section class="${classes}" id="item-${s.item}">
    ${meta}
    <h2 class="rundown__title">${s.title}</h2>
    ${photoHtml}
    <div class="rundown__body">${renderBodyBlock(s)}</div>
  </section>`;
}

    <h2 class="rundown__title">${c.title}</h2>
    <div class="rundown__body">
      <a class="contact__email" href="mailto:${c.email}">${c.email}</a>
      <p>${c.note}</p>
      <p class="signature">${c.signature}</p>
    </div>
  </section>`;
}

const main = document.getElementById("main");
main.innerHTML = buildLensDemo(profile.lensDemo)
  + profile.sections.map(buildSection).join("")
  + buildContact(profile.contact);

// Lens demo interaction
const lensButton = document.getElementById("lensButton");
const lensVoices = document.getElementById("lensVoices");
const lensScope = document.getElementById("lensScope");
lensButton.addEventListener("click", ()=>{
  const isOpen = lensButton.getAttribute("aria-expanded") === "true";
  lensButton.setAttribute("aria-expanded", String(!isOpen));
  if(!isOpen){
    lensVoices.hidden = false;
    lensScope.hidden = false;
  } else {
    lensVoices.hidden = true;
    lensScope.hidden = true;
  }
});

// Studio clock
function tick(){
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  document.getElementById("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
tick();
setInterval(tick, 1000);

// Scroll reveal
const items = document.querySelectorAll(".rundown__item");
if("IntersectionObserver" in window){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("is-visible"); io.unobserve(e.target); } });
  }, { threshold:0.12 });
  items.forEach(i=>io.observe(i));
} else {
  items.forEach(i=>i.classList.add("is-visible"));
}
</script>
</body>
</html>
